[project]
name = "whatsapp-agent"
version = "0.1.0"
description = "Multi-tenant WhatsApp AI sales agent for Indian D2C brands"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
