<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dilea WhatsApp Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=boska@500,700&display=swap" rel="stylesheet">
<style>
  :root {
    --indigo: #332778; --indigo-700: #271d60; --orange: #F15C25; --cream: #FFFDF5; --silver: #DDDDDD;
    --bg: #FFFDF5; --panel: #ffffff; --soft: #f6f3ea; --ink: #1d1838; --muted: #6c6889; --line: #ebe7dc;
    --primary: #332778; --primary-ink: #ffffff; --primary-soft: #efecf9; --accent: #F15C25; --accent-soft: #fdebe3;
    --ok: #17845b; --ok-soft: #e3f4ec; --warn: #b8520f; --warn-soft: #fcefe3; --danger: #c0262d; --danger-soft: #fbe7e7;
    --blue: #2f7cf6; --blue-soft: #e7f0fe; --grey-soft: #efeee9;
    --sidebar: #332778; --sidebar-ink: #FFFDF5; --sidebar-muted: rgba(255, 253, 245, .62); --sidebar-hover: rgba(255, 253, 245, .08);
    --bubble-in: #ffffff; --bubble-out: #ece9fb;
    --radius: 14px; --shadow: 0 1px 2px rgba(51, 39, 120, .05), 0 6px 24px rgba(51, 39, 120, .06);
    --font: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --display: "Boska", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #110e24; --panel: #1a1634; --soft: #211c40; --ink: #f2effc; --muted: #a6a1c6; --line: #2d2752;
      --primary: #8d82ea; --primary-ink: #120e26; --primary-soft: #2a2456; --accent: #f47a4e; --accent-soft: #3a2420;
      --ok: #4cc79a; --ok-soft: #173229; --warn: #f0a15f; --warn-soft: #3a2a1a; --danger: #f07a7e; --danger-soft: #3a1c22;
      --blue: #6aa5ff; --blue-soft: #1a2846; --grey-soft: #26223f;
      --sidebar: #191338; --bubble-in: #221d42; --bubble-out: #2e2763;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; }
  h2 { font-size: 19px; }
  h3 { font-size: 15px; }
  a { color: var(--primary); }
  code { background: var(--soft); padding: 1px 6px; border-radius: 6px; font-size: 12px; }

  /* ---------- shell ---------- */
  .app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
  .sidebar { background: var(--sidebar); color: var(--sidebar-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 22px 14px; z-index: 30; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 4px; color: var(--sidebar-ink); }
  .logo .mark { width: 46px; color: var(--orange); flex: none; }
  .logo .word { width: 92px; }
  .logo svg { display: block; width: 100%; height: auto; }
  .suite { padding: 0 12px 18px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--sidebar-muted); border-bottom: 1px solid rgba(255, 253, 245, .12); margin-bottom: 14px; }
  .nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .nav .group { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--sidebar-muted); padding: 14px 12px 6px; }
  .nav button { all: unset; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--sidebar-muted); font-weight: 500; position: relative; }
  .nav button:hover { background: var(--sidebar-hover); color: var(--sidebar-ink); }
  .nav button.active { background: rgba(255, 253, 245, .12); color: var(--sidebar-ink); }
  .nav button.active::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--orange); }
  .nav button svg { width: 18px; height: 18px; flex: none; }
  .nav .badge { margin-left: auto; background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
  .sidebar .foot { margin-top: auto; padding: 14px 12px 0; border-top: 1px solid rgba(255, 253, 245, .12); font-size: 12px; color: var(--sidebar-muted); display: flex; align-items: center; justify-content: space-between; }
  .sidebar .foot button { all: unset; cursor: pointer; color: var(--sidebar-ink); text-decoration: underline; text-underline-offset: 3px; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar h1 { font-size: 24px; line-height: 1.1; }
  .topbar .sub { color: var(--muted); font-size: 13px; }
  .topbar .spacer { flex: 1; }
  .brandpick { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 12px; box-shadow: var(--shadow); }
  .brandpick .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--muted); }
  .brandpick .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .brandpick select { border: 0; background: transparent; font-weight: 600; padding: 6px 4px; width: auto; min-width: 150px; box-shadow: none; }
  .topbar button.hamburger { display: none; }
  .content { padding: 24px 28px 60px; max-width: 1280px; width: 100%; }
  .scrim { display: none; }

  /* ---------- building blocks ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-h p { margin: 2px 0 0; }
  .card-h .spacer { flex: 1; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .error { color: var(--danger); }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; transition: border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); padding: 0; }
  textarea { min-height: 90px; resize: vertical; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; font-weight: 500; color: var(--ink); margin: 0; cursor: pointer; }
  .check input { margin-top: 2px; flex: none; }

  button.primary, button.secondary, button.accent, button.ghost, a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; font: 600 13px var(--font); cursor: pointer; border: 1px solid transparent; transition: transform .05s, background .15s, box-shadow .15s; text-decoration: none; white-space: nowrap; }
  button.primary { background: var(--primary); color: var(--primary-ink); }
  button.primary:hover { box-shadow: 0 6px 16px color-mix(in srgb, var(--primary) 35%, transparent); }
  button.accent { background: var(--accent); color: #fff; }
  button.accent:hover { box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
  button.secondary, a.btn { background: var(--panel); color: var(--ink); border-color: var(--line); }
  button.secondary:hover, a.btn:hover { border-color: var(--primary); color: var(--primary); }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
  button.ghost:hover { color: var(--primary); background: var(--primary-soft); }
  button.danger { color: var(--danger); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; box-shadow: none; }
  .sm { padding: 6px 10px !important; font-size: 12px !important; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--grey-soft); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn, .pill.human { background: var(--warn-soft); color: var(--warn); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }
  .pill.indigo, .pill.bot { background: var(--primary-soft); color: var(--primary); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .pill.orange { background: var(--accent-soft); color: var(--accent); }

  .kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 18px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .kpi .l { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .kpi .v { font: 700 28px/1.15 var(--font); margin-top: 6px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .kpi .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .kpi.accent::after { content: ""; position: absolute; right: -24px; top: -24px; width: 80px; height: 80px; border-radius: 99px; background: var(--accent-soft); }
  .stat { font: 700 26px var(--font); font-variant-numeric: tabular-nums; }
  .kpis.mini { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .kpis.mini .kpi { box-shadow: none; padding: 12px; background: var(--soft); }
  .kpis.mini .kpi .v { font-size: 22px; }
  .hamburger svg { width: 22px; height: 22px; }

  .table-wrap { overflow-x: auto; margin: 0 -20px -20px; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 14px; background: var(--soft); position: sticky; top: 0; }
  td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td, tr.sel td { background: var(--primary-soft); }
  td .who b { display: block; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .big { font: 700 18px var(--display); color: var(--ink); margin-bottom: 6px; }

  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--soft); }
  .bar span { display: block; height: 100%; }
  .hbar { display: grid; grid-template-columns: 140px 1fr 48px; gap: 10px; align-items: center; margin: 8px 0; font-size: 13px; }
  .hbar .track { height: 10px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .hbar .fill { height: 100%; border-radius: 99px; background: var(--primary); }
  .callout { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); margin-bottom: 18px; flex-wrap: wrap; }
  .callout .t { flex: 1; min-width: 220px; }
  .callout.info { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 20%, transparent); }

  /* audience segment cards */
  .segs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 18px; }
  .seg { all: unset; box-sizing: border-box; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; border-top: 4px solid var(--c, var(--line)); transition: transform .1s; }
  .seg:hover { transform: translateY(-2px); }
  .seg.on { outline: 2px solid var(--c); outline-offset: 0; }
  .seg .n { font: 700 26px/1.1 var(--font); font-variant-numeric: tabular-nums; }
  .seg .lbl { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .seg .d { color: var(--muted); font-size: 12px; }
  .seg .w { color: var(--danger); font-size: 12px; font-weight: 600; }

  /* WhatsApp ticks */
  .tick { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tick svg { width: 18px; height: 12px; }
  .tick.sent, .tick.delivered { color: #8a8aa0; }
  .tick.read { color: #34b7f1; }
  .tick.replied { color: var(--ok); }
  .tick.failed { color: var(--danger); }

  /* chat */
  .split { display: grid; grid-template-columns: 340px 1fr; gap: 18px; }
  .list { padding: 0; overflow: hidden; }
  .list .tabsbar { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); }
  .list .scroll { max-height: calc(100vh - 230px); overflow: auto; }
  .list-item { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list-item:hover, .list-item.active { background: var(--primary-soft); }
  .avatar { width: 38px; height: 38px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; flex: none; }
  .list-item .meta { min-width: 0; flex: 1; }
  .list-item .meta .top { display: flex; gap: 6px; align-items: center; }
  .list-item .meta .top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .preview { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat { display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 12px; min-height: 360px; max-height: calc(100vh - 330px); overflow-y: auto;
    background: var(--soft) radial-gradient(color-mix(in srgb, var(--primary) 7%, transparent) 1px, transparent 1px) 0 0 / 18px 18px; }
  .bubble { max-width: 72%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0, 0, 0, .06); }
  .bubble.in { align-self: flex-start; background: var(--bubble-in); border-top-left-radius: 4px; }
  .bubble.out { align-self: flex-end; background: var(--bubble-out); border-top-right-radius: 4px; }
  .bubble small { display: flex; justify-content: flex-end; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .bubble img { max-width: 240px; border-radius: 8px; display: block; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips.list { flex-direction: column; align-items: stretch; }
  .chip { font: 600 13px var(--font); padding: 7px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); color: var(--primary); background: var(--panel); text-align: left; text-decoration: none; }
  button.chip { cursor: pointer; }
  button.chip:hover { background: var(--primary-soft); }
  .row-chip { display: flex; flex-direction: column; }
  .row-chip span { color: var(--muted); font-size: 12px; font-weight: 400; }
  .events { font-size: 12px; color: var(--muted); margin-top: 10px; }
  details > summary { cursor: pointer; font-weight: 600; color: var(--primary); margin: 6px 0; }
  .steps { display: grid; gap: 4px; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; display: none; max-width: 380px; z-index: 50; box-shadow: var(--shadow); font-weight: 500; }
  .login { min-height: 100vh; display: grid; place-items: center; background: var(--sidebar); padding: 20px; }
  .login .card { width: 100%; max-width: 400px; }
  .login .logo { color: var(--cream); justify-content: center; margin-bottom: 18px; }
  .login .logo .word { width: 130px; }
  .login .logo .mark { width: 64px; }
  .loading { padding: 40px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .spinner { width: 16px; height: 16px; border-radius: 99px; border: 2px solid var(--line); border-top-color: var(--primary); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; transform: translateX(-100%); transition: transform .2s; }
    .app.open .sidebar { transform: none; }
    .app.open .scrim { display: block; position: fixed; inset: 0; background: rgba(17, 14, 36, .45); z-index: 25; }
    .topbar button.hamburger { display: inline-flex; }
    .topbar { padding: 10px 14px; flex-wrap: wrap; gap: 8px 10px; }
    .topbar .ttl { flex: 1 1 0; min-width: 0; }
    .topbar .sub, .topbar .spacer { display: none; }
    .brandpick { order: 5; flex: 1 1 100%; box-shadow: none; }
    .brandpick select { flex: 1; }
    #newBrand { padding: 9px 12px; }
    .topbar h1 { font-size: 20px; }
    .content { padding: 16px 16px 60px; }
    .split { grid-template-columns: 1fr; }
    .bubble { max-width: 90%; }
    .brandpick select { min-width: 110px; }
    .hbar { grid-template-columns: 100px 1fr 40px; }
    .segs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .seg { padding: 12px; }
    .seg .d { display: none; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

function toast(msg, isError) {
  const t = $("#toast");
  t.textContent = msg; t.style.display = "block"; t.style.background = isError ? "var(--danger)" : "";

}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(opts.headers || {}) },
    body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body,
  });
  if (res.status === 401 || res.status === 403) { askToken(); throw new Error("Please sign in again"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail ?? data));
  return data;
}
async function apiForm(path, form) {
  const res = await fetch(path, { method: "POST", headers: { Authorization: `Bearer ${token}` }, body: form });
  if (res.status === 401 || res.status === 403) { askToken(); throw new Error("Please sign in again"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail ?? data));
  return data;
}
async function download(path, filename) {
  const res = await fetch(path, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) return toast("Download failed", true);
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function askToken() {
  $("#root").innerHTML = `<div class="login"><div>
    <div class="logo"><span class="mark">${LOGO_MARK}</span><span class="word">${LOGO_WORD}</span></div>
    <div class="card"><h2>Sign in</h2><p class="muted">WhatsApp Suite admin console</p>

  </div></div>`;

function newBrandForm() {
  setTitle(tenantId ? "New brand" : "Welcome", "One brand = one client business: its WhatsApp number, bot, inbox and campaigns.");
  $("#view").innerHTML = `<div class="card" style="max-width:520px"><h2>${tenantId ? "Add a brand" : "Add your first brand"}</h2>

    <p class="row" style="margin-bottom:0"><button class="primary">Create brand</button>${tenantId ? `<button type="button" class="secondary" id="nb_cancel">Cancel</button>` : ""}</p></form></div>`;

async function loadTenants() {
  tenants = await api("/admin/tenants");
  const sel = $("#tenantSelect");
  sel.innerHTML = tenants.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("");

function setTitle(title, sub) { $("#pageTitle").textContent = title; $("#pageSub").textContent = sub || ""; document.title = `${title} · Dilea WhatsApp Suite`; }
const views = {};
const card = (title, sub, body, actions = "") => `<div class="card"><div class="card-h"><div><h2>${title}</h2>${sub ? `<p class="muted small">${sub}</p>` : ""}</div><span class="spacer"></span>${actions}</div>${body}</div>`;
const empty = (title, text, action = "") => `<div class="empty"><div class="big">${title}</div><div>${text}</div>${action ? `<p>${action}</p>` : ""}</div>`;

/* ---------- Overview ---------- */
views.overview = async (el) => {
  const [a, aud, camps] = await Promise.all([api(T("/analytics?days=30")), api(T("/audience?limit=1")), api(T("/campaigns"))]);
  const kpi = (l, v, s = "", accent = false) => `<div class="kpi ${accent ? "accent" : ""}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
  const sum = aud.summary;
  const reached = Object.entries(sum).filter(([k]) => k !== "excluded").reduce((s, [, n]) => s + n, 0);
  const waste = (sum.not_delivered || 0) + (sum.failed || 0);
  const stages = ["new", "browsing", "interested", "checkout_sent", "ordered", "lost"];
  const maxStage = Math.max(1, ...stages.map((s) => a.leads_by_stage[s] || 0));
  const cod = a.cod_confirmation, codTotal = Object.values(cod).reduce((s, n) => s + n, 0);
  const sentAll = camps.reduce((s, c) => s + c.counts.sent + c.counts.delivered + c.counts.read + c.counts.failed, 0);
  const readAll = camps.reduce((s, c) => s + c.counts.read, 0);
  const replAll = camps.reduce((s, c) => s + (c.counts.replied || 0), 0);
  el.innerHTML = `
  ${waste ? `<div class="callout"><div class="t"><b>${waste} numbers never receive your campaigns.</b> <span class="muted">That's about ${inr(waste * RATE.MARKETING)} wasted on every marketing campaign.</span></div><button class="accent" id="goAudience">Clean up audience</button></div>` : ""}
  <div class="kpis">
    ${kpi("Conversations", a.conversations, "last 30 days")}
    ${kpi("Customer messages", a.messages_in)}
    ${kpi("Bot replies", a.bot_replies, a.human_replies ? `${a.human_replies} by your team` : "")}
    ${kpi("Needs a human", a.open_handoffs, "open handoffs", a.open_handoffs > 0)}
    ${kpi("Orders via bot", a.orders_by_bot.count, inr(a.orders_by_bot.revenue))}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    ${card("Campaign performance", `${camps.length} campaigns`, sentAll ? `
      <div class="kpis mini" style="margin-bottom:10px">${kpi("Messages sent", sentAll)}${kpi("Seen", sentAll ? Math.round((readAll / sentAll) * 100) + "%" : "-")}${kpi("Replied", sentAll ? Math.round((replAll / sentAll) * 100) + "%" : "-")}</div>
      ${Object.entries(SEG_UI).filter(([k]) => k !== "excluded").map(([k, s]) => `<div class="hbar"><span>${ticks(s.status)} ${esc(aud.labels[k])}</span><div class="track"><div class="fill" style="width:${reached ? ((sum[k] || 0) / reached) * 100 : 0}%;background:${s.c}"></div></div><b>${sum[k] || 0}</b></div>`).join("")}`
      : empty("No campaigns yet", "Send your first bulk message to see who reads and replies.", `<button class="primary" data-go="campaigns">Create a campaign</button>`))}
    ${card("Lead funnel", "Where customers are in their buying journey", stages.map((s) => `<div class="hbar"><span>${s.replace("_", " ")}</span><div class="track"><div class="fill" style="width:${((a.leads_by_stage[s] || 0) / maxStage) * 100}%"></div></div><b>${a.leads_by_stage[s] || 0}</b></div>`).join(""))}
    ${card("COD confirmation", "Website COD orders confirmed on WhatsApp", codTotal ? Object.entries(cod).map(([k, v]) => `<div class="hbar"><span>${esc(k.replace("_", " "))}</span><div class="track"><div class="fill" style="width:${(v / codTotal) * 100}%;background:${k === "confirmed" ? "var(--ok)" : k === "cancelled" ? "var(--danger)" : "var(--accent)"}"></div></div><b>${v}</b></div>`).join("") : empty("No COD orders yet", "Connect your store to confirm COD orders automatically."))}
  </div>`;
  const go = $("#goAudience", el); if (go) go.onclick = () => navigate("audience", { segment: "not_delivered" });
  el.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => navigate(b.dataset.go));
};

function navigate(to, filter) {
  tab = to; store.set("wa_tab", tab); openCampaign = null; openConv = null;
  audienceFilter = { segment: null, q: "", campaign: null, ...(filter || {}) };
  render();
}

/* ---------- Audience ---------- */
let audienceFilter = { segment: null, q: "", campaign: null };
const selected = new Set();
views.audience = async (el) => {
  selected.clear();
  const f = audienceFilter;
  const qs = new URLSearchParams({ limit: "500" });
  if (f.segment) qs.set("segment", f.segment); if (f.q) qs.set("q", f.q); if (f.campaign) qs.set("campaign_id", f.campaign.id);
  const a = await api(T(`/audience?${qs}`));
  const sum = a.summary;
  const reached = Object.entries(sum).filter(([k]) => k !== "excluded").reduce((s, [, n]) => s + n, 0);
  const waste = (sum.not_delivered || 0) + (sum.failed || 0);
  el.innerHTML = `
  ${f.campaign ? `<div class="callout info"><div class="t">Showing people from campaign <b>${esc(f.campaign.name)}</b>.</div><button class="secondary" id="clearCamp">Show everyone</button></div>` : ""}
  ${waste && f.segment !== "excluded" ? `<div class="callout"><div class="t"><b>${waste} numbers are wasting money.</b> <span class="muted">Single-tick and failed numbers are charged on every marketing campaign but never see it (~${inr(waste * RATE.MARKETING)} per campaign).</span></div><button class="accent" id="excludeWaste">Exclude all ${waste}</button></div>` : ""}
  <div class="segs">${Object.entries(SEG_UI).map(([k, s]) => {
    const n = sum[k] || 0, pct = reached && k !== "excluded" ? Math.round((n / reached) * 100) + "%" : "";
    const w = (k === "not_delivered" || k === "failed") && n ? `<span class="w">~${inr(n * RATE.MARKETING)} wasted / campaign</span>` : "";
    return `<button class="seg ${f.segment === k ? "on" : ""}" data-seg="${k}" style="--c:${s.c}"><span class="lbl">${s.status ? ticks(s.status) : "⦸"} ${esc(a.labels[k])}</span><span class="n">${n}</span><span class="d">${pct ? pct + " · " : ""}${s.d}</span>${w}</button>`;
  }).join("")}</div>
  <div class="card">
    <div class="card-h">
      <div><h2>${f.segment ? esc(a.labels[f.segment]) : "Everyone reached by campaigns"}</h2><p class="muted small">${a.total} people${a.total > a.rows.length ? ` · showing ${a.rows.length}` : ""} · "Seen" needs read receipts on; people with them off look "not seen" even if they read.</p></div>
      <span class="spacer"></span>
      <input id="aq" placeholder="Search name or number" value="${esc(f.q)}" style="width:220px">
      ${f.segment ? `<button class="ghost" id="clearSeg">Clear filter</button>` : ""}
      <button class="secondary" id="export">Export CSV</button>
    </div>
    <div class="row" id="bulkbar" style="display:none;margin-bottom:12px">
      <span class="pill indigo" id="selCount"></span>
      <button class="accent sm" id="bulkEx">Exclude from campaigns</button>
      <button class="secondary sm" id="bulkIn">Include again</button>
    </div>
    ${a.rows.length ? `<div class="table-wrap"><table>
      <tr><th style="width:36px"><input type="checkbox" id="selAll"></th><th>Customer</th><th>Status</th><th>Sent</th><th>Delivered</th><th>Seen</th><th>Replied</th><th>Last campaign</th><th></th></tr>
      ${a.rows.map((r) => `<tr data-phone="${r.phone}">
        <td><input type="checkbox" class="sel" value="${r.phone}"></td>
        <td><div class="row" style="flex-wrap:nowrap"><span class="avatar">${esc(initials(r.name, r.phone))}</span><span class="who"><b>${esc(r.name || "Unknown")}</b><span class="muted small">+${esc(r.phone)}</span></span></div></td>
        <td>${ticks(SEG_UI[r.segment]?.status || "sent", true)}${r.excluded ? `<br><span class="pill" title="${esc(r.excluded_reason || "")}">excluded</span>` : ""}${r.opted_out ? ` <span class="pill danger">STOP</span>` : ""}</td>
        <td>${r.attempts}</td><td>${r.delivered}</td><td>${r.read}</td><td>${r.replied}</td>
        <td class="muted">${ago(r.last_sent_at)}</td>
        <td>${r.excluded ? `<button class="ghost sm" data-in="${r.phone}">Include</button>` : `<button class="ghost sm danger" data-ex="${r.phone}">Exclude</button>`}</td>
      </tr>`).join("")}
    </table></div>` : empty(f.segment ? "Nobody here" : "No campaign data yet", f.segment ? "Try another segment." : "Once you send bulk messages, every customer's ticks and replies show up here.")}
  </div>`;
  el.querySelectorAll("[data-seg]").forEach((b) => b.onclick = () => { audienceFilter.segment = audienceFilter.segment === b.dataset.seg ? null : b.dataset.seg; render(); });
  const cs = $("#clearSeg", el); if (cs) cs.onclick = () => { audienceFilter.segment = null; render(); };
  const cc = $("#clearCamp", el); if (cc) cc.onclick = () => { audienceFilter.campaign = null; render(); };

  $("#export", el).onclick = () => download(T(`/audience/export.csv?${f.segment ? "segment=" + f.segment : ""}${f.campaign ? "&campaign_id=" + f.campaign.id : ""}`), `audience-${f.segment || "all"}.csv`);
  const exclude = async (body, label) => {
    const r = await api(T("/audience/exclude"), { method: "POST", body });
    toast(`${r.excluded} ${r.excluded === 1 ? "number" : "numbers"} excluded from future campaigns`); render();
  };
  const ew = $("#excludeWaste", el);
  if (ew) ew.onclick = async () => {
    if (!ew.dataset.armed) { ew.dataset.armed = "1"; ew.textContent = "Click again to confirm"; return; }
    const extra = f.campaign ? { campaign_id: f.campaign.id } : {};
    await api(T("/audience/exclude"), { method: "POST", body: { segment: "not_delivered", reason: "single tick (never delivered)", ...extra } });
    await exclude({ segment: "failed", reason: "delivery failed", ...extra }, "numbers");
  };
  el.querySelectorAll("[data-ex]").forEach((b) => b.onclick = () => exclude({ phones: [b.dataset.ex], reason: "excluded manually" }, "number"));
  el.querySelectorAll("[data-in]").forEach((b) => b.onclick = async () => { await api(T("/audience/include"), { method: "POST", body: { phones: [b.dataset.in] } }); toast("Included again"); render(); });
  const sync = () => {
    $("#bulkbar", el).style.display = selected.size ? "" : "none";
    $("#selCount", el).textContent = `${selected.size} selected`;
    el.querySelectorAll("tr[data-phone]").forEach((tr) => tr.classList.toggle("sel", selected.has(tr.dataset.phone)));
  };
  el.querySelectorAll(".sel").forEach((c) => c.onchange = () => { c.checked ? selected.add(c.value) : selected.delete(c.value); sync(); });
  const all = $("#selAll", el); if (all) all.onchange = () => { el.querySelectorAll(".sel").forEach((c) => { c.checked = all.checked; all.checked ? selected.add(c.value) : selected.delete(c.value); }); sync(); };
  const be = $("#bulkEx", el); if (be) be.onclick = () => exclude({ phones: [...selected], reason: "excluded manually" }, "numbers");
  const bi = $("#bulkIn", el); if (bi) bi.onclick = async () => { await api(T("/audience/include"), { method: "POST", body: { phones: [...selected] } }); toast("Included again"); render(); };
};

  const c = convs.find((x) => x.id === openConv);

    <div class="card-h"><span class="avatar">${esc(initials(c.contact.name, c.contact.wa_id))}</span>
      <div><h2>${esc(c.contact.name || "Customer")}</h2><p class="muted small">+${esc(c.contact.wa_id)}${c.contact.source ? " · " + esc(c.contact.source) : ""}${c.contact.lead_note ? " · " + esc(c.contact.lead_note) : ""}</p></div>
      <span class="spacer"></span>
      ${c.mode === "bot" ? `<button class="secondary" id="take">Take over</button>` : `<button class="primary" id="release">Hand back to bot</button>`}</div>
    <div class="chat" id="conv_chat">${msgs.map((m) => `${bubble(m)}${m.direction === "out" && m.sender === "bot" ? `<button class="ghost sm" style="align-self:flex-end" data-fix="${m.id}">Teach a better answer</button>` : ""}`).join("")}</div>
    <div class="row" style="margin-top:12px">

      <button class="primary" id="send" ${c.can_reply ? "" : "disabled"}>Send</button>
    </div>`;
  const chat = $("#conv_chat", panel); chat.scrollTop = chat.scrollHeight;

  const rel = $("#release", panel); if (rel) rel.onclick = () => setMode("bot");
  const sendReply = async () => {
    const text = $("#reply", panel).value.trim(); if (!text) return;
    if (c.mode === "bot") await api(T(`/conversations/${c.id}/mode`), { method: "POST", body: { mode: "human" } });

    if (r.error) toast(r.error, true); render();

  $("#send", panel).onclick = sendReply;

      toast("Saved. The bot will use this answer from now on."); render();
    };
  });
};

function chips(m, clickable) {
  const it = m.payload?.interactive;
  if (!it) return "";
  const chip = (id, title) => clickable
    ? `<button class="chip" data-id="${esc(id)}" data-title="${esc(title)}">${esc(title)}</button>`
    : `<span class="chip">${esc(title)}</span>`;
  if (it.type === "button") return `<div class="chips">${it.action.buttons.map((b) => chip(b.reply.id, b.reply.title)).join("")}</div>`;
  if (it.type === "list") return `<div class="chips list"><span class="muted small">☰ ${esc(it.action.button)}</span>${
    it.action.sections.flatMap((sec) => sec.rows).map((r) => clickable
      ? `<button class="chip row-chip" data-id="${esc(r.id)}" data-title="${esc(r.title)}"><b>${esc(r.title)}</b>${r.description ? `<span>${esc(r.description)}</span>` : ""}</button>`
      : `<span class="chip">${esc(r.title)}</span>`).join("")}</div>`;
  if (it.type === "cta_url") return `<div class="chips"><a class="chip" href="${esc(it.action.parameters.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(it.action.parameters.display_text)}</a></div>`;
  return "";
}

function bubble(m, clickable = false) {
  const out = m.direction === "out";
  const it = m.payload?.interactive;
  const imgUrl = m.payload?.image?.link || it?.header?.image?.link;
  const img = imgUrl ? `<img src="${esc(imgUrl)}" alt="">` : "";
  const text = it ? (it.body?.text || "") : m.body;
  const time = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  const meta = out ? `<small>${esc(m.sender || "")}${time ? " · " + time : ""}${m.status ? " " + ticks(m.status) : ""}${m.error ? ` <span class="error">${esc(m.error)}</span>` : ""}</small>`
    : (time ? `<small>${time}</small>` : "");
  return `<div class="bubble ${out ? "out" : "in"}">${img}${esc(text)}${chips(m, clickable)}${meta}</div>`;
}

    <div class="chat" id="pg_chat"></div>
    <div class="row" style="margin-top:12px">
      <input id="pg_input" placeholder="e.g. hi · blue bedsheet · delivery kab hogi?" style="flex:1">
      <button class="primary" id="pg_send">Send</button>
    </div>
    <div class="events" id="pg_events"></div>`, `<button class="secondary" id="pg_reset">Reset chat</button>`);
  const chat = $("#pg_chat", el);
  const post = async (body, shown) => {
    chat.insertAdjacentHTML("beforeend", `<div class="bubble in">${esc(shown)}</div>`);
    const btn = $("#pg_send", el); btn.disabled = true; btn.textContent = "…";
    try {
      const r = await api(T("/playground"), { method: "POST", body: { ...body, session } });
      r.replies.forEach((m) => chat.insertAdjacentHTML("beforeend", bubble({ ...m, direction: "out" }, true)));
      const ev = r.events.map((e) => e.type === "tool" ? `${e.name}${e.error ? " (error)" : ""}` : e.type === "faq" ? `faq:${e.source}` : e.type);
      $("#pg_events", el).textContent = `Mode: ${r.reply_mode === "menu" ? "menu bot (no AI)" : "AI"} · Lead stage: ${r.lead_stage}${r.handed_off ? " · handed off to human" : ""}${ev.length ? " · " + ev.join(", ") : ""}`;
    } catch (e) { toast(e.message, true); }
    btn.disabled = false; btn.textContent = "Send"; chat.scrollTop = chat.scrollHeight;
  };
  const send = () => { const input = $("#pg_input", el); const text = input.value.trim(); if (!text) return; input.value = ""; post({ message: text }, text); };
  chat.addEventListener("click", (e) => { const b = e.target.closest("button.chip"); if (!b) return; post({ button: { id: b.dataset.id, title: b.dataset.title } }, b.dataset.title); });
  $("#pg_send", el).onclick = send;
  $("#pg_input", el).addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  $("#pg_reset", el).onclick = async () => { await api(T(`/playground/${session}`), { method: "DELETE" }); chat.innerHTML = ""; $("#pg_events", el).textContent = ""; };
};

/* ---------- Bulk messages ---------- */
let openCampaign = null;
let campaignTimer = null;
function progressBar(c) {
  const k = c.counts, total = Math.max(c.total, 1);
  const seg = (n, color) => n ? `<span style="width:${(n / total) * 100}%;background:${color}"></span>` : "";
  return `<div class="bar">${seg(k.read, "#34b7f1")}${seg(k.delivered, "#8a8aa0")}${seg(k.sent, "#c9c8d6")}${seg(k.failed, "var(--danger)")}${seg(k.skipped, "var(--accent)")}</div>`;
}
const CAMP_PILL = { draft: "", sending: "orange", paused: "danger", done: "ok", cancelled: "danger" };

views.campaigns = async (el) => {
  clearInterval(campaignTimer);
  if (openCampaign === "new") return campaignForm(el);
  if (openCampaign) return campaignDetail(el, openCampaign);
  const list = await api(T("/campaigns"));
  el.innerHTML = card("Campaigns", "Only message people who agreed to hear from you. STOP, excluded and dead numbers are skipped automatically.", list.length ? `<div class="table-wrap"><table>
      <tr><th>Campaign</th><th>Status</th><th>Progress</th><th>Sent</th><th>Delivered</th><th>Seen</th><th>Replied</th><th>Failed</th></tr>
      ${list.map((c) => { const k = c.counts, sent = k.sent + k.delivered + k.read + k.failed; return `<tr class="clickable" data-cp="${c.id}">
        <td><b>${esc(c.name)}</b><br><span class="muted small">${esc(c.template_name)} · ${ago(c.created_at)}</span></td>
        <td><span class="pill ${CAMP_PILL[c.status] || ""}">${esc(c.status)}</span></td><td style="min-width:140px">${progressBar(c)}</td>
        <td>${sent}/${c.total}</td><td>${k.delivered + k.read}</td><td>${k.read}</td><td>${k.replied || 0}</td><td>${k.failed}</td></tr>`; }).join("")}
    </table></div>` : empty("No campaigns yet", "Upload a CSV, pick an approved template, send yourself a test, then send to everyone."),
    `<button class="accent" id="cp_new">+ New campaign</button>`);
  $("#cp_new", el).onclick = () => { openCampaign = "new"; render(); };
  el.querySelectorAll("[data-cp]").forEach((r) => r.onclick = () => { openCampaign = Number(r.dataset.cp); render(); });
};

async function campaignForm(el) {

  el.innerHTML = `<div class="card" style="max-width:860px">
    <div class="card-h"><div><h2>New campaign</h2><p class="muted small">Step by step: template → customer list → variables → check.</p></div><span class="spacer"></span><button class="secondary" id="cp_back">← Back</button></div>
    <form id="cp_form" class="steps">
      <p><label>Campaign name</label><input name="name" required minlength="2" placeholder="e.g. Diwali sale 2026"></p>
      <p><label>Template (approved in WhatsApp Manager)</label>
        <select id="cp_tpl">${templates.map((t, i) => `<option value="${i}">${t.approved ? "" : "⏳ "}${esc(t.name)} · ${esc(t.language)} · ${esc(t.category || "")}${t.approved ? "" : " — " + esc(t.status || "not approved")}</option>`).join("")}
        <option value="manual">Type the template name myself…</option></select></p>
      ${note ? `<div class="callout ${note.includes("still being reviewed") ? "" : "info"}" style="margin:8px 0">${esc(note)}</div>` : ""}
      ${elsewhere.length ? `<div class="callout" style="margin:8px 0;flex-direction:column;align-items:stretch">
        <b>Templates found on your other WhatsApp accounts</b>
        <span class="small">A template only works from numbers of the account it was created in. Create it again under this brand's account (WhatsApp Manager → select this number's account → Create template).</span>
        ${elsewhere.map((a) => `<span class="small"><b>${a.phones.map(esc).join(", ") || esc(a.waba_id)}</b> (account ${esc(a.waba_id)}): ${a.templates.map((t) => `${esc(t.name)} <span class="muted">(${esc(t.status)})</span>`).join(", ")}</span>`).join("")}
      </div>` : ""}
      <p id="cp_status" class="muted small"></p>
      <div id="cp_manual" class="grid" style="display:none">
        <div><label>Template name</label><input id="cp_mname" placeholder="diwali_offer"></div>
        <div><label>Language code</label><input id="cp_mlang" value="en"></div>
        <div><label>Number of variables ({{1}}, {{2}}…)</label><input id="cp_mcount" type="number" min="0" max="10" value="1"></div>
        <div><label>Category</label><select id="cp_mcat"><option>MARKETING</option><option>UTILITY</option></select></div>
      </div>
      <div id="cp_preview" class="bubble out" style="max-width:100%;margin:8px 0;display:none"></div>
      <p><label>Customer list (CSV with a phone column; other columns can fill the variables)</label>
        <input type="file" id="cp_file" accept=".csv,text/csv" required></p>
      <p class="muted small" id="cp_cols"></p>
      <div id="cp_params"></div>
      <p id="cp_imgwrap" style="display:none"><label id="cp_imglabel">Header image link (this template has an image header)</label><input id="cp_img" placeholder="https://yourwebsite.com/offer.jpg">
        <span class="muted small">Must be a public, direct https link to a .jpg or .png (max 5 MB), not a Google Drive, Instagram or web page link. Meta downloads it from this link.</span></p>
      <div class="callout info" style="flex-direction:column;align-items:stretch;gap:8px">
        <b>Save money automatically</b>
        <label class="check"><input type="checkbox" id="cp_skip_dead" checked> Skip numbers whose last 2+ campaign messages never got delivered (single tick)</label>
        <label class="check"><input type="checkbox" id="cp_skip_quiet"> Skip people who got 3+ campaigns and never replied</label>
        <span class="muted small">People you excluded in Audience and customers who sent STOP are always skipped.</span>
      </div>
      <label class="check" style="margin:8px 0 14px"><input type="checkbox" id="cp_consent" required> Everyone in this list has agreed to receive WhatsApp messages from this brand.</label>
      <div><button class="primary" id="cp_submit">Upload &amp; check list</button></div>
    </form>
    <div id="cp_result"></div>
  </div>`;
  $("#cp_back", el).onclick = () => { openCampaign = null; render(); };
  let columns = [];
  const current = () => {
    const v = $("#cp_tpl", el).value;
    if (v === "manual") return { name: $("#cp_mname", el).value.trim(), language: $("#cp_mlang", el).value.trim() || "en",
      param_count: Number($("#cp_mcount", el).value) || 0, category: $("#cp_mcat", el).value, header: null, body: "" };
    return templates[Number(v)];
  };
  const drawParams = () => {
    const t = current();
    $("#cp_manual", el).style.display = $("#cp_tpl", el).value === "manual" ? "" : "none";
    const pv = $("#cp_preview", el);
    pv.style.display = t?.body ? "" : "none";
    pv.textContent = t?.body || "";
    const manual = $("#cp_tpl", el).value === "manual";
    const needsImage = t?.header === "IMAGE";
    $("#cp_imgwrap", el).style.display = needsImage || manual ? "" : "none";
    $("#cp_img", el).required = needsImage;
    $("#cp_imglabel", el).textContent = needsImage ? "Header image link (required: this template has an image header)" : "Header image link (only if your template has an image header)";
    const st = $("#cp_status", el);
    if (t && t.status && !t.approved) st.innerHTML = `<span class="error">⏳ This template is <b>${esc(t.status)}</b>, not approved yet. Meta will reject sends until it's Approved.</span>`;
    else st.textContent = "";
    const n = t?.param_count || 0;
    const nameCol = columns.find((c) => /name/i.test(c));
    $("#cp_params", el).innerHTML = n ? `<label>Fill the variables</label>` + Array.from({ length: n }, (_, i) => `
      <div class="row" style="margin:6px 0;flex-wrap:nowrap">
        <span class="pill indigo">{{${i + 1}}}</span>
        <select data-psrc="${i}" style="width:auto">${columns.map((c) => `<option value="col:${esc(c)}" ${i === 0 && c === nameCol ? "selected" : ""}>Column: ${esc(c)}</option>`).join("")}<option value="text">Same text for everyone</option></select>
        <input data-pval="${i}" placeholder="${columns.length ? "If empty in CSV, use… (e.g. Customer)" : "Text"}" style="flex:1">
      </div>`).join("") : "";
  };
  $("#cp_tpl", el).onchange = drawParams;
  $("#cp_mcount", el).oninput = drawParams;
  $("#cp_file", el).onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const text = await file.text();
    const first = text.replace(/^﻿/, "").split(/\r?\n/)[0] || "";
    const cells = first.split(first.includes(";") && !first.includes(",") ? ";" : ",").map((c) => c.trim().replace(/^"|"$/g, ""));
    const headerless = cells.some((c) => c.replace(/\D/g, "").length >= 10);
    columns = headerless ? ["phone", "name"] : cells;
    const rows = text.split(/\r?\n/).filter((l) => l.trim()).length - (headerless ? 0 : 1);
    $("#cp_cols", el).textContent = `${rows} rows · columns: ${columns.join(", ")}`;
    drawParams();
  };
  drawParams();
  $("#cp_form", el).onsubmit = async (e) => {
    e.preventDefault();
    const t = current();
    if (!t?.name) return toast("Pick or type a template", true);
    const params = Array.from({ length: t.param_count || 0 }, (_, i) => {
      const src = $(`[data-psrc="${i}"]`, el).value, val = $(`[data-pval="${i}"]`, el).value.trim();
      return src === "text" ? { source: "text", value: val } : { source: "column", value: src.slice(4), fallback: val };
    });
    const fd = new FormData();
    fd.append("name", e.target.name.value.trim());
    fd.append("template_name", t.name);
    fd.append("template_language", t.language);
    if (t.category) fd.append("template_category", t.category);
    fd.append("params", JSON.stringify(params));
    fd.append("skip_never_delivered", $("#cp_skip_dead", el).checked ? "true" : "false");
    fd.append("skip_never_replied", $("#cp_skip_quiet", el).checked ? "true" : "false");
    if ($("#cp_img", el).value.trim()) fd.append("header_image_url", $("#cp_img", el).value.trim());
    fd.append("file", $("#cp_file", el).files[0]);
    const btn = $("#cp_submit", el); btn.disabled = true; btn.textContent = "Checking…";
    try {
      const r = await apiForm(T("/campaigns"), fd);
      const s = r.skipped || {};
      const rate = RATE[r.template_category] ?? RATE.MARKETING;
      $("#cp_result", el).innerHTML = `<div class="card" style="margin:18px 0 0;box-shadow:none">
        <h2>List checked</h2>
        <div class="kpis" style="margin:12px 0">
          <div class="kpi"><div class="l">Will receive</div><div class="v">${r.valid - (s.total || 0)}</div><div class="s">≈ ${inr((r.valid - (s.total || 0)) * rate)} Meta charge</div></div>
          <div class="kpi accent"><div class="l">Skipped (saved)</div><div class="v">${s.total || 0}</div><div class="s">${s.opted_out || 0} STOP · ${s.excluded || 0} excluded · ${s.never_delivered || 0} dead · ${s.never_replied || 0} never reply</div></div>
          <div class="kpi"><div class="l">Removed from file</div><div class="v">${r.duplicates + r.invalid}</div><div class="s">${r.duplicates} duplicates · ${r.invalid} invalid</div></div>
        </div>
        ${r.invalid_samples.length ? `<p class="muted small">Invalid: ${r.invalid_samples.map(esc).join(", ")}</p>` : ""}
        <div class="table-wrap" style="margin:0"><table><tr><th>Phone</th><th>Name</th><th>Variables</th></tr>${r.preview.map((p) => `<tr><td>+${esc(p.phone)}</td><td>${esc(p.name || "")}</td><td>${p.params.map(esc).join(" · ")}</td></tr>`).join("")}</table></div>
        <p style="margin-bottom:0"><button class="primary" id="cp_open">Continue →</button></p></div>`;
      $("#cp_open", el).onclick = () => { openCampaign = r.id; render(); };
    } catch (err) { toast(err.message, true); }
    btn.disabled = false; btn.textContent = "Upload & check list";
  };
}

async function campaignDetail(el, id) {
  const c = await api(T(`/campaigns/${id}`));
  const k = c.counts;
  const toSend = k.pending + k.sent + k.delivered + k.read + k.failed;
  const sent = k.sent + k.delivered + k.read + k.failed;
  const rate = RATE[c.template_category] ?? RATE.MARKETING;
  const pct = (n) => sent ? Math.round((n / sent) * 100) + "%" : "-";
  const kpi = (l, v, s, status) => `<div class="kpi"><div class="l">${status ? ticks(status) + " " : ""}${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  setTitle(c.name, `Template ${c.template_name} (${c.template_language}${c.template_category ? ", " + c.template_category : ""}) · ${c.total} numbers`);
  el.innerHTML = `
  <div class="row" style="margin-bottom:14px"><button class="secondary" id="cd_back">← All campaigns</button><span class="pill ${CAMP_PILL[c.status] || ""}">${esc(c.status)}</span>
    ${c.status === "sending" ? `<span class="muted small"><span class="spinner" style="display:inline-block;vertical-align:middle"></span> sending · updates every 5s</span>` : ""}
    <span class="spacer" style="flex:1"></span>
    ${sent ? `<button class="secondary" id="cd_aud">See who read & replied</button>` : ""}
    ${c.status === "sending" || c.status === "paused" ? `<button class="secondary danger" id="cd_cancel">${c.status === "paused" ? "Cancel campaign" : "Stop sending"}</button>` : ""}</div>
  ${c.status === "paused" ? `<div class="callout" style="align-items:stretch;flex-direction:column">
    <div><b>Campaign paused: there is a problem with the template.</b><br><span>${esc(c.pause_reason || "")}</span><br>
      <span class="muted small">Nobody was marked as failed: the ${k.pending} waiting customer(s) are still in the queue. Fix it and resume.</span></div>
    ${c.template_name ? `<div class="row" style="flex-wrap:nowrap"><input id="cd_img" placeholder="New image link (https://…/offer.jpg)" value="${esc(c.header_image_url || "")}" style="flex:1"><button class="accent" id="cd_resume">Resume sending</button></div>` : ""}
  </div>` : ""}
  <div class="kpis">
    ${kpi("Waiting", k.pending, "in queue")}
    ${kpi("Single tick", k.sent, pct(k.sent) + " not delivered yet", "sent")}
    ${kpi("Delivered", k.delivered + k.read, pct(k.delivered + k.read), "delivered")}
    ${kpi("Seen", k.read, pct(k.read), "read")}
    ${kpi("Replied", k.replied || 0, pct(k.replied || 0), "replied")}
    ${kpi("Failed", k.failed, pct(k.failed), "failed")}
    ${kpi("Skipped", k.skipped, "STOP / excluded / dead")}
  </div>
  <div class="card">${progressBar(c)}</div>
  ${c.status === "draft" ? `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    ${card("1. Send yourself a test", "Check the message on your own phone first.", `<div class="row"><input id="cd_phone" placeholder="Your WhatsApp number, e.g. 98765 43210" style="flex:1"><button class="secondary" id="cd_test">Send test</button></div><p class="muted small" id="cd_test_out"></p>`)}
    ${card("2. Send to everyone", `${toSend} customers · approx Meta charge <b>${inr(toSend * rate)}</b> (~₹${rate}/message, check Meta's current rates)`, `<div class="row"><button class="accent" id="cd_start">Start sending</button><button class="ghost danger" id="cd_cancel">Discard draft</button></div>`)}
  </div>` : ""}
  ${c.status === "done" && k.sent + k.failed ? `<div class="callout"><div class="t"><b>${k.sent + k.failed} numbers in this campaign were never reached.</b> <span class="muted">Exclude them so the next campaign doesn't pay for them.</span></div><button class="accent" id="cd_clean">Exclude unreached</button></div>` : ""}
  ${c.problems.length ? card("Not sent", "Skipped or failed numbers and why", `<div class="table-wrap"><table><tr><th>Phone</th><th>Name</th><th>Status</th><th>Reason</th></tr>
      ${c.problems.map((p) => `<tr><td>+${esc(p.phone)}</td><td>${esc(p.name || "")}</td><td><span class="pill ${p.status === "failed" ? "danger" : "orange"}">${esc(p.status)}</span></td><td class="muted">${esc(p.error || "")}</td></tr>`).join("")}</table></div>`) : ""}`;
  $("#cd_back", el).onclick = () => { openCampaign = null; render(); };
  const aud = $("#cd_aud", el); if (aud) aud.onclick = () => navigate("audience", { campaign: { id, name: c.name } });
  const test = $("#cd_test", el);
  if (test) test.onclick = async () => {
    try {
      const r = await api(T(`/campaigns/${id}/test`), { method: "POST", body: { phone: $("#cd_phone", el).value } });
      $("#cd_test_out", el).textContent = r.status === "failed" ? `Failed: ${r.error}` : `Sent (${r.status}). Check your WhatsApp.`;
    } catch (err) { toast(err.message, true); }
  };
  const start = $("#cd_start", el);
  if (start) start.onclick = async () => {
    if (!start.dataset.armed) { start.dataset.armed = "1"; start.textContent = `Click again to send to ${toSend} customers`; return; }
    await api(T(`/campaigns/${id}/start`), { method: "POST" }); toast("Sending started"); render();
  };
  const resume = $("#cd_resume", el);
  if (resume) resume.onclick = async () => {
    resume.disabled = true;
    try { await api(T(`/campaigns/${id}/resume`), { method: "POST", body: { header_image_url: $("#cd_img", el).value.trim() || null } }); toast("Resumed"); render(); }
    catch (err) { toast(err.message, true); resume.disabled = false; }
  };
  const cancelBtn = $("#cd_cancel", el);
  if (cancelBtn) cancelBtn.onclick = async () => { await api(T(`/campaigns/${id}/cancel`), { method: "POST" }); render(); };
  const clean = $("#cd_clean", el);
  if (clean) clean.onclick = async () => {
    await api(T("/audience/exclude"), { method: "POST", body: { segment: "not_delivered", campaign_id: id, reason: `single tick in ${c.name}` } });
    const r = await api(T("/audience/exclude"), { method: "POST", body: { segment: "failed", campaign_id: id, reason: `failed in ${c.name}` } });
    toast("Unreached numbers excluded from future campaigns"); render();
  };
  if (c.status === "sending") campaignTimer = setInterval(() => { if (tab === "campaigns" && openCampaign === id) render(); else clearInterval(campaignTimer); }, 5000);
}

      <div class="grid">
        <div><label>Welcome message</label><textarea id="m_welcome">${esc(cfg.menu.welcome_text)}</textarea></div>
        <div><label>When the bot doesn't understand</label><textarea id="m_unknown">${esc(cfg.menu.not_understood)}</textarea></div>
        <div><label>Hand-over message</label><textarea id="m_handoff">${esc(cfg.menu.handoff_text)}</textarea></div>
        <div><label>Follow-up (sent once if the customer goes quiet)</label><textarea id="m_follow">${esc(cfg.menu.followup_text)}</textarea></div>
        <div><label>Button: products</label><input id="m_b1" maxlength="20" value="${esc(cfg.menu.products_label)}"></div>
        <div><label>Button: track order</label><input id="m_b2" maxlength="20" value="${esc(cfg.menu.track_label)}"></div>
        <div><label>Button: talk to team</label><input id="m_b3" maxlength="20" value="${esc(cfg.menu.human_label)}"></div>
      </div>
    </details>`)}
  ${card("Brand & personality", "Personality, tone and rules are used by the AI bot. Brand name and hours appear in menu messages.", `
    <div class="grid">
      <div><label>Brand name (shown to customers)</label><input id="c_brand" value="${esc(cfg.brand_name)}"></div>
      <div><label>Assistant name</label><input id="c_assistant" value="${esc(cfg.assistant_name)}"></div>
      <div><label>Website</label><input id="c_url" value="${esc(cfg.store_url || "")}"></div>
      <div><label>Support hours</label><input id="c_hours" value="${esc(cfg.support_hours)}"></div>
    </div>
    <p><label>About the brand (what you sell, who buys, what makes you different)</label><textarea id="c_about">${esc(cfg.about)}</textarea></p>
    <div class="grid">
      <div><label>Tone</label><textarea id="c_tone">${esc(cfg.tone)}</textarea></div>
      <div><label>Language</label><textarea id="c_lang">${esc(cfg.language)}</textarea></div>
    </div>
    <p><label>Rules (one per line)</label><textarea id="c_rules">${esc(cfg.rules.join("\n"))}</textarea></p>
    <p><label>Offers (one per line: CODE | description)</label><textarea id="c_offers">${esc(cfg.offers.map((o) => `${o.code} | ${o.description}`).join("\n"))}</textarea></p>
    <p><label>Always hand over to a human for (comma separated)</label><input id="c_handoff" value="${esc(cfg.handoff_triggers.join(", "))}"></p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px">
      <label class="check"><input type="checkbox" id="c_enabled" ${cfg.enabled ? "checked" : ""}> Bot replies enabled</label>
      <label class="check"><input type="checkbox" id="c_cod" ${cfg.allow_cod_orders_in_chat ? "checked" : ""}> Allow COD orders in chat</label>
      <label class="check"><input type="checkbox" id="c_codflow" ${cfg.cod_confirmation.enabled ? "checked" : ""}> COD confirmation for website orders</label>
      <label class="check"><input type="checkbox" id="c_ship" ${cfg.shipping_update.enabled ? "checked" : ""}> Shipping updates</label>
      <label class="check"><input type="checkbox" id="c_follow" ${cfg.lead_followup.enabled ? "checked" : ""}> Follow up silent leads</label>
    </div>
    <details style="margin-top:12px"><summary>Advanced (templates, timings, model) as JSON</summary>
      <textarea id="c_json" style="min-height:240px;font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify(cfg, null, 2))}</textarea>
      <p class="muted small">Edits here are applied first; the form fields above override them.</p>
    </details>`, `<button class="primary" id="c_save">Save changes</button>`)}
  ${card("Knowledge", "Policies, FAQs, shipping, size guide. The bot answers questions from these.", `
    <div>${knowledge.map((kd) => `
      <details class="list-item" style="display:block;cursor:default;padding:10px 0"><summary style="color:var(--ink)"><b>${esc(kd.title)}</b> <span class="muted" style="font-weight:400">${esc(kd.content.slice(0, 80))}…</span></summary>
        <p><input data-kt="${kd.id}" value="${esc(kd.title)}"></p><p><textarea data-kc="${kd.id}">${esc(kd.content)}</textarea></p>
        <div class="row"><button class="secondary sm" data-ksave="${kd.id}">Save</button><button class="ghost sm danger" data-kdel="${kd.id}">Delete</button></div>
      </details>`).join("") || empty("Nothing yet", "Add your return policy, shipping times, COD rules, care instructions…")}</div>
    <div class="card" style="box-shadow:none;background:var(--soft);margin:14px 0 0">
      <h3>Add knowledge</h3>
      <p><input id="k_title" placeholder="Title, e.g. Shipping & delivery"></p>
      <p><textarea id="k_content" placeholder="Write it the way you'd explain it to a new sales person."></textarea></p>
      <button class="primary" id="k_add">Add knowledge</button>
    </div>`)}
  ${card("Approved answers", "When the bot gets something wrong, write the right answer. It reuses it for similar questions.", `
    ${corrections.length ? `<div class="table-wrap" style="margin-bottom:14px"><table><tr><th>Customer asks</th><th>Bot should answer</th><th></th></tr>
    ${corrections.map((c) => `<tr><td>${esc(c.question)}</td><td>${esc(c.answer)}</td><td><button class="ghost sm danger" data-cdel="${c.id}">Delete</button></td></tr>`).join("")}</table></div>` : ""}
    <div class="grid" style="margin-top:14px">
      <div><label>Customer asks</label><textarea id="q_q"></textarea></div>
      <div><label>Bot should answer</label><textarea id="q_a"></textarea></div>
    </div>
    <p style="margin-bottom:0"><button class="primary" id="q_add">Add answer</button></p>`)}`;

  $("#c_mode", el).value = cfg.reply_mode;
  $("#c_save", el).onclick = async () => {
    let base;
    try { base = JSON.parse($("#c_json", el).value); } catch { return toast("Advanced JSON is invalid", true); }
    const lines = (sel) => $(sel, el).value.split("\n").map((s) => s.trim()).filter(Boolean);
    const body = {
      ...base,
      brand_name: $("#c_brand", el).value, assistant_name: $("#c_assistant", el).value, store_url: $("#c_url", el).value || null,
      support_hours: $("#c_hours", el).value, about: $("#c_about", el).value, tone: $("#c_tone", el).value, language: $("#c_lang", el).value,
      rules: lines("#c_rules"),
      offers: lines("#c_offers").map((l) => { const [code, ...d] = l.split("|"); return { code: code.trim(), description: d.join("|").trim() }; }),
      handoff_triggers: $("#c_handoff", el).value.split(",").map((s) => s.trim()).filter(Boolean),
      enabled: $("#c_enabled", el).checked, allow_cod_orders_in_chat: $("#c_cod", el).checked,
      reply_mode: $("#c_mode", el).value,
      menu: { ...base.menu, welcome_text: $("#m_welcome", el).value, not_understood: $("#m_unknown", el).value,
        handoff_text: $("#m_handoff", el).value, followup_text: $("#m_follow", el).value,
        products_label: $("#m_b1", el).value, track_label: $("#m_b2", el).value, human_label: $("#m_b3", el).value },
      cod_confirmation: { ...base.cod_confirmation, enabled: $("#c_codflow", el).checked },
      shipping_update: { ...base.shipping_update, enabled: $("#c_ship", el).checked },
      lead_followup: { ...base.lead_followup, enabled: $("#c_follow", el).checked },
    };
    try { await api(T("/config"), { method: "PUT", body }); toast("Saved. The bot uses it from the next message."); render(); } catch (err) { toast(err.message, true); }
  };
  $("#k_add", el).onclick = async () => {
    try { await api(T("/knowledge"), { method: "POST", body: { title: $("#k_title", el).value, content: $("#k_content", el).value } }); toast("Added"); render(); } catch (err) { toast(err.message, true); }
  };
  el.querySelectorAll("[data-ksave]").forEach((b) => b.onclick = async () => {
    const kid = b.dataset.ksave;
    await api(T(`/knowledge/${kid}`), { method: "PUT", body: { title: $(`[data-kt="${kid}"]`, el).value, content: $(`[data-kc="${kid}"]`, el).value } }); toast("Saved");
  });
  el.querySelectorAll("[data-kdel]").forEach((b) => b.onclick = async () => {
    if (b.dataset.armed) { await api(T(`/knowledge/${b.dataset.kdel}`), { method: "DELETE" }); return render(); }
    b.dataset.armed = "1"; b.textContent = "Click again to delete";
  });
  $("#q_add", el).onclick = async () => {
    try { await api(T("/corrections"), { method: "POST", body: { question: $("#q_q", el).value, answer: $("#q_a", el).value } }); toast("Added"); render(); } catch (err) { toast(err.message, true); }
  };
  el.querySelectorAll("[data-cdel]").forEach((b) => b.onclick = async () => { await api(T(`/corrections/${b.dataset.cdel}`), { method: "DELETE" }); render(); });
};

/* ---------- Setup ---------- */
views.setup = async (el) => {
  const t = await api(T());
  el.innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="l">WhatsApp</div><div class="v" style="font-size:20px">${t.whatsapp ? esc(t.whatsapp.display_phone || t.whatsapp.phone_number_id) : "Not connected"}</div><div class="s">${t.whatsapp ? "number connected" : "replies are simulated until connected"}</div></div>
    <div class="kpi"><div class="l">Store</div><div class="v" style="font-size:20px">${t.store ? esc(t.store.kind) : "Not connected"}</div><div class="s">${t.active_products} active products</div></div>
    <div class="kpi"><div class="l">Brand id</div><div class="v" style="font-size:13px;font-family:ui-monospace,monospace;word-break:break-all">${t.id}</div><div class="s">${t.active ? "active" : "paused"}</div></div>
  </div>
  ${card("Brand", "Name shown here and in bot messages to customers.", `
    <label>Brand name</label>
    <div class="row" style="flex-wrap:nowrap"><input id="b_name" value="${esc(t.name)}" maxlength="200" style="flex:1"><button class="primary" id="b_save">Save name</button></div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="b_active" ${t.active ? "checked" : ""}> Brand active (bot replies to this brand's customers)</label>
    <details style="margin-top:14px"><summary style="color:var(--danger)">Delete brand</summary>
      <p class="muted small">Permanently deletes <b>${esc(t.name)}</b> with its inbox, contacts, campaigns, training and WhatsApp connection. This cannot be undone. Type the brand name to confirm.</p>
      <div class="row" style="flex-wrap:nowrap"><input id="b_confirm" placeholder="${esc(t.name)}" style="flex:1"><button class="secondary danger" id="b_delete">Delete permanently</button></div>
    </details>`)}
  ${card("1. WhatsApp number", "Paste your permanent system-user token, pick your number, then save. Saving checks the number with Meta and subscribes the app.", `
    <label>Permanent access token</label>
    <div class="row" style="flex-wrap:nowrap"><input id="wa_token" type="password" style="flex:1" placeholder="${t.whatsapp ? "•••••• saved (paste a new one to replace)" : "Paste the token that starts with EAA…"}">
      <button class="secondary" id="wa_find">Find my numbers</button></div>
    <div id="wa_numbers" class="chips list" style="margin:10px 0"></div>
    <div class="grid">
      <div><label>Phone number ID</label><input id="wa_pnid" value="${esc(t.whatsapp?.phone_number_id || "")}"></div>
      <div><label>WABA ID (Messaging account ID)</label><input id="wa_waba" value="${esc(t.whatsapp?.waba_id || "")}"></div>
      <div><label>Display phone</label><input id="wa_phone" placeholder="+91 98xxx xxxxx" value="${esc(t.whatsapp?.display_phone || "")}"></div>
    </div>
    <p class="row" style="margin-bottom:0"><button class="primary" id="wa_save">Save &amp; connect WhatsApp</button>${t.whatsapp ? `<button class="secondary" id="wa_check">Check connection</button>` : ""}</p>
    <div id="wa_result"></div>`)}
  ${card("2. Meta webhook", "One time, in your Meta app → WhatsApp → Configuration → Webhook → Edit. Then subscribe the <b>messages</b> field.", `
    <div class="grid">
      <div><label>Callback URL</label><input readonly value="${esc(t.meta_webhook_url)}" onclick="this.select()"></div>
      <div><label>Verify token</label><input readonly value="${esc(t.meta_verify_token)}" onclick="this.select()"></div>
    </div>`)}
  ${card("3. Store (optional)", t.store ? `Connected: <b>${esc(t.store.kind)}</b> · ${esc(t.store.base_url)} · last sync ${t.store.last_synced_at ? ago(t.store.last_synced_at) : "never"}${t.store.last_error ? ` <span class="error">· ${esc(t.store.last_error)}</span>` : ""}` : "Connect your shop so the bot knows products, prices and orders.", `
    ${t.store ? `<p class="small">Store webhook URL: <code>${esc(t.store.webhook_url)}</code></p>` : ""}
    <div class="grid">
      <div><label>Platform</label><select id="st_kind">
        <option value="custom">Custom / Next.js (WA Agent kit)</option><option value="shopify">Shopify</option><option value="woocommerce">WooCommerce</option></select></div>
      <div><label id="st_url_label">Store API URL</label><input id="st_url" placeholder="https://yourstore.com/api/wa-agent"></div>
    </div>
    <div class="grid" id="st_creds" style="margin-top:12px"></div>
    ${t.store?.kind === "custom" ? `<label class="check" style="margin-top:12px"><input type="checkbox" id="st_rotate"> Issue a new shared secret (the store's WA_AGENT_SECRET must be updated)</label>` : ""}
    <p class="row" style="margin-bottom:0"><button class="primary" id="st_save">Connect store</button>${t.store ? `<button class="secondary" id="st_sync">Sync products now</button>` : ""}</p>
    <div id="st_result"></div>`)}`;
  $("#b_save", el).onclick = async () => {
    const name = $("#b_name", el).value.trim();
    if (name.length < 2) return toast("Brand name is too short", true);
    try { await api(T(), { method: "PATCH", body: { name } }); toast("Brand renamed"); await loadTenants(); render(); } catch (err) { toast(err.message, true); }
  };
  $("#b_active", el).onchange = async (e) => {
    try { await api(T(), { method: "PATCH", body: { active: e.target.checked } }); toast(e.target.checked ? "Brand active" : "Brand paused: the bot will not reply"); }
    catch (err) { e.target.checked = !e.target.checked; toast(err.message, true); }
  };
  $("#b_delete", el).onclick = async () => {
    const confirmName = $("#b_confirm", el).value.trim();
    if (confirmName !== t.name) return toast(`Type "${t.name}" exactly to delete`, true);
    try {
      await api(T(`?confirm=${encodeURIComponent(confirmName)}`), { method: "DELETE" });
      toast(`${t.name} deleted`); tenantId = null; store.del("wa_tenant"); await loadTenants(); tab = "overview"; store.set("wa_tab", tab); render();
    } catch (err) { toast(err.message, true); }
  };
  const kind = $("#st_kind", el);
  if (t.store) kind.value = t.store.kind;
  const credFields = {
    custom: [["secret", t.store ? "Shared secret (leave empty to keep the current one)" : "Shared secret (leave empty to generate)"]],
    shopify: [["access_token", "Admin API access token"], ["api_secret", "App API secret (webhooks)"], ["storefront_url", "Storefront URL (optional, e.g. https://brand.in)"]],
    woocommerce: [["consumer_key", "Consumer key"], ["consumer_secret", "Consumer secret"], ["webhook_secret", "Webhook secret"]],
  };
  const urlLabels = { custom: "Store API URL (…/api/wa-agent)", shopify: "Shop URL (https://x.myshopify.com)", woocommerce: "Site URL" };
  const drawCreds = () => {
    $("#st_url_label", el).textContent = urlLabels[kind.value];
    $("#st_creds", el).innerHTML = credFields[kind.value].map(([key, l]) => `<div><label>${l}</label><input data-cred="${key}" type="${key.includes("url") ? "text" : "password"}"></div>`).join("");
  };
  kind.addEventListener("change", drawCreds); drawCreds();
  if (t.store) $("#st_url", el).value = t.store.base_url;

  const showCheck = (c) => {
    const box = $("#wa_result", el);
    if (!c) { box.innerHTML = `<p class="muted small">Saved (sandbox number: nothing is sent to Meta).</p>`; return; }
    const ph = c.phone || {};
    box.innerHTML = `<div class="callout ${c.ok ? "info" : ""}" style="margin:14px 0 0;flex-direction:column;align-items:stretch">
      <b>${c.ok ? "✅ WhatsApp connected" : "⚠️ Almost there"}</b>
      ${c.phone ? `<span>Number <b>${esc(ph.display_phone_number || "")}</b> · name <b>${esc(ph.verified_name || "")}</b>${ph.name_status ? ` (${esc(ph.name_status)})` : ""} · quality <b>${esc(ph.quality_rating || "-")}</b></span>` : ""}
      <span>${c.subscribed ? "✅ App subscribed: customer messages will reach the bot" : "❌ App not subscribed yet"}</span>
      ${c.problems.length ? `<ul style="margin:4px 0 0">${c.problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    </div>`;
    refreshDot();
  };
  $("#wa_save", el).onclick = async () => {
    const access_token = $("#wa_token", el).value.trim() || null;
    if (!access_token && !t.whatsapp) return toast("Paste the access token first", true);
    const btn = $("#wa_save", el); btn.disabled = true; btn.textContent = "Connecting…";
    try {
      const r = await api(T("/whatsapp"), { method: "PUT", body: { phone_number_id: $("#wa_pnid", el).value.trim(), waba_id: $("#wa_waba", el).value.trim() || null, display_phone: $("#wa_phone", el).value.trim() || null, access_token } });
      $("#wa_token", el).value = "";
      showCheck(r.check);
    } catch (err) { toast(err.message, true); }
    btn.disabled = false; btn.textContent = "Save & connect WhatsApp";
  };
  $("#wa_find", el).onclick = async () => {
    const access_token = $("#wa_token", el).value.trim();
    if (!access_token) return toast("Paste the token first", true);
    const btn = $("#wa_find", el); btn.disabled = true; btn.textContent = "Looking…";
    const box = $("#wa_numbers", el);
    try {
      const { numbers } = await api(T("/whatsapp/discover"), { method: "POST", body: { access_token } });
      const real = numbers.filter((n) => !n.is_test_number);
      box.innerHTML = real.length
        ? `<span class="muted small">Pick your number:</span>` + real.map((n, i) => `<button class="chip row-chip" data-pick="${i}"><b>${esc(n.display_phone_number)}</b><span>${esc(n.verified_name || "")} · quality ${esc(n.quality_rating || "-")}</span></button>`).join("")
        : `<p class="error">No business number found for this token${numbers.length ? " (only Meta's test number)" : ""}. In Business settings → System users → Assign assets, give this user your WhatsApp account, then generate the token again.</p>`;
      box.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
        const n = real[Number(b.dataset.pick)];
        $("#wa_pnid", el).value = n.phone_number_id; $("#wa_waba", el).value = n.waba_id; $("#wa_phone", el).value = n.display_phone_number;
        box.innerHTML = `<p class="small">✅ Selected <b>${esc(n.display_phone_number)}</b>. Now click <b>Save &amp; connect WhatsApp</b>.</p>`;
      });
      if (real.length === 1) box.querySelector("[data-pick]").click();
    } catch (err) { box.innerHTML = `<p class="error">${esc(err.message)}</p>`; }
    btn.disabled = false; btn.textContent = "Find my numbers";
  };
  const check = $("#wa_check", el);
  if (check) check.onclick = async () => {
    check.disabled = true; check.textContent = "Checking…";
    try { showCheck((await api(T("/whatsapp/check"), { method: "POST" })).check); } catch (err) { toast(err.message, true); }
    check.disabled = false; check.textContent = "Check connection";
  };
  $("#st_save", el).onclick = async () => {
    const credentials = {};
    el.querySelectorAll("[data-cred]").forEach((i) => { if (i.value.trim()) credentials[i.dataset.cred] = i.value.trim(); });
    const rotate = $("#st_rotate", el)?.checked && kind.value === "custom";
    try {
      const r = await api(T("/store"), { method: "PUT", body: { kind: kind.value, base_url: $("#st_url", el).value.trim(), credentials, rotate_secret: !!rotate } });
      $("#st_result", el).innerHTML = `<div class="callout info" style="margin:14px 0 0;flex-direction:column;align-items:stretch"><b>Saved. Product sync started.</b>
        <span>Webhook URL for the store: <code>${esc(r.webhook_url)}</code></span>
        ${r.shared_secret ? `<span><b>Shared secret (shown once):</b> <code>${esc(r.shared_secret)}</code><br><span class="muted small">${esc(r.note)}</span></span>` : ""}</div>`;
      toast("Store connected");
    } catch (err) { toast(err.message, true); }
  };
  const sync = $("#st_sync", el);
  if (sync) sync.onclick = async () => { await api(T("/store/sync"), { method: "POST" }); toast("Sync queued. Refresh in a few seconds."); };
};

/* ---------- render ---------- */
async function refreshDot() {
  const t = tenants.find((x) => x.id === tenantId);
  const dot = $("#waDot"); if (!dot) return;
  dot.classList.toggle("on", !!t?.whatsapp);
  dot.title = t?.whatsapp ? `WhatsApp ${t.whatsapp}` : "WhatsApp not connected";
}
async function refreshBadge() {
  try {
    const convs = await api(T("/conversations?mode=human"));
    const b = $("#handoffBadge"); if (!b) return;
    b.textContent = convs.length; b.style.display = convs.length ? "" : "none";
  } catch {}
}

async function render() {
  if (!$("#app")) shell();
  document.querySelectorAll("#nav button[data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  const el = $("#view");
  if (!tenantId) return newBrandForm();
  const page = PAGES.find((p) => p.id === tab) || PAGES[1];
  setTitle(page.label, page.sub);
  refreshDot();
  el.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
  try { await (views[tab] || views.overview)(el); } catch (e) { el.innerHTML = `<div class="card error">${esc(e.message)}</div>`; }
  refreshBadge();
}

async function boot() {
  if (!token) return askToken();
  shell();
  try { await loadTenants(); render(); } catch (e) { if (token) $("#view").innerHTML = `<div class="card error">${esc(e.message)}</div>`; }
}
boot();
</script>
</body>
</html>
